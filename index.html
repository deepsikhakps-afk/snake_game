<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #1e1e2f;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
  }
  h1 { margin: 10px; letter-spacing: 2px; }
  #score { font-size: 20px; margin-bottom: 10px; }
  canvas {
    background: #14141f;
    border: 4px solid #4caf50;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(76,175,80,0.5);
  }
  #overlay {
    position: absolute;
    text-align: center;
    color: #fff;
    display: none;
    background: rgba(0,0,0,0.7);
    padding: 30px 50px;
    border-radius: 10px;
  }
  #overlay button {
    margin-top: 15px;
    padding: 8px 20px;
    font-size: 16px;
    background: #4caf50;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
  }
  #overlay button:hover { background: #43a047; }
  #instructions { margin-top: 10px; font-size: 14px; color: #aaa; }
</style>
</head>
<body>
<h1>🐍 Snake Game</h1>
<div id="score">Score: 0 | High Score: 0</div>
<div id="difficulty">
  <label>Speed:
    <select id="speedSelect">
      <option value="180">Slow</option>
      <option value="110" selected>Medium</option>
      <option value="60">High</option>
    </select>
  </label>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="instructions">Use Arrow Keys or WASD to move. Press Space to pause.</div>
<div id="overlay">
  <div id="overlay-text">Game Over</div>
  <button onclick="restartGame()">Play Again</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const box = 20;
const cols = canvas.width / box;
const rows = canvas.height / box;

let snake, direction, nextDirection, food, score, highScore, gameLoop, paused, gameOver;

highScore = localStorage.getItem('snakeHighScore') || 0;

function initGame() {
  snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
  direction = 'RIGHT';
  nextDirection = 'RIGHT';
  score = 0;
  paused = false;
  gameOver = false;
  placeFood();
  updateScore();
  document.getElementById('overlay').style.display = 'none';
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(draw, 110);
}

function placeFood() {
  let valid = false;
  while (!valid) {
    food = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
    valid = !snake.some(s => s.x === food.x && s.y === food.y);
  }
}

function updateScore() {
  document.getElementById('score').textContent =
    `Score: ${score} | High Score: ${highScore}`;
}

document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (key === ' ') {
    if (!gameOver) paused = !paused;
    return;
  }
  if ((key === 'arrowup' || key === 'w') && direction !== 'DOWN') nextDirection = 'UP';
  else if ((key === 'arrowdown' || key === 's') && direction !== 'UP') nextDirection = 'DOWN';
  else if ((key === 'arrowleft' || key === 'a') && direction !== 'RIGHT') nextDirection = 'LEFT';
  else if ((key === 'arrowright' || key === 'd') && direction !== 'LEFT') nextDirection = 'RIGHT';
});

function draw() {
  if (paused || gameOver) return;

  direction = nextDirection;

  let head = {x: snake[0].x, y: snake[0].y};
  if (direction === 'UP') head.y--;
  else if (direction === 'DOWN') head.y++;
  else if (direction === 'LEFT') head.x--;
  else if (direction === 'RIGHT') head.x++;

  // Wall collision
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
    return endGame();
  }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return endGame();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
    }
    updateScore();
    placeFood();
  } else {
    snake.pop();
  }

  // Draw background
  ctx.fillStyle = '#14141f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw food
  ctx.fillStyle = '#ff5252';
  ctx.beginPath();
  ctx.arc(food.x * box + box/2, food.y * box + box/2, box/2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // Draw snake
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#8bc34a' : '#4caf50';
    ctx.fillRect(s.x * box + 1, s.y * box + 1, box - 2, box - 2);
  });

  if (paused) {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = '20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', canvas.width/2, canvas.height/2);
  }
}

function endGame() {
  gameOver = true;
  clearInterval(gameLoop);
  document.getElementById('overlay-text').textContent = `Game Over! Score: ${score}`;
  document.getElementById('overlay').style.display = 'block';
}

function restartGame() {
  initGame();
}

initGame();
</script>
</body>
</html>
